<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="尤浈棋 · 摄影与视觉艺术作品集 | Yóu Zhēnqí · Photography & Visual Art" />
  <title>尤浈棋 · Yóu Zhēnqí</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 颗粒质感叠层 -->
  <div class="grain" aria-hidden="true"></div>

  <!-- 自定义光标 -->
  <div class="cursor" aria-hidden="true"><span class="cursor__dot"></span><span class="cursor__ring"></span></div>

  <!-- 顶部导航 -->
  <header class="nav" id="nav">
    <a class="nav__logo" href="#/" data-link>YZ<span>·</span></a>
    <nav class="nav__links" id="navLinks">
      <a href="#works" data-i18n="nav_works">作品</a>
      <a href="#about" data-i18n="nav_about">关于</a>
      <a href="#contact" data-i18n="nav_contact">联系</a>
    </nav>
    <div class="nav__tools">
      <div class="lang" id="langSwitch" role="group" aria-label="language">
        <button data-lang="zh" class="is-active">中</button>
        <button data-lang="en">EN</button>
        <button data-lang="de">DE</button>
      </div>
      <div class="music" id="musicGroup" role="group" aria-label="music">
        <button class="music__btn" id="musicToggle" aria-label="play" data-play="false">
          <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
        </button>
        <button class="music__btn" id="musicMute" aria-label="mute" data-mute="true">
          <svg class="icon-vol" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-1 7-4.5 7-8.8s-3-7.9-7-8.8z"/></svg>
          <svg class="icon-mute" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M16.5 12c0-1.8-1-3.3-2.5-4v2.2l2.5 2.5V12zm2.5 0c0 .7-.1 1.4-.4 2l1.4 1.4c.6-1.1.9-2.3.9-3.5 0-4.3-3-7.9-7-8.8v2.1c2.9.9 5 3.5 5 6.7zM4.4 4L3 5.4l4.6 4.6H3v6h4l5 5V12.8l4.6 4.6-1.4 1.4L14 15.2V20l-5-5H3V9h3.2L4.4 4zm11.6.3l-1.2 1.2c-.3-.1-.5-.2-.8-.3V3.2c.7.1 1.4.4 2 .6v.5z"/></svg>
        </button>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="theme">
        <span class="theme-toggle__sun">☀</span>
        <span class="theme-toggle__moon">☾</span>
      </button>
      <button class="nav__burger" id="burger" aria-label="menu"><span></span><span></span></button>
    </div>
  </header>

  <!-- 主舞台：由 JS 渲染 首页 / 详情 -->
  <main id="app"></main>

  <!-- 页脚 -->
  <footer class="footer" id="footer">
    <p data-i18n="footer">© 2026 尤浈棋 · 版权所有 · 占位演示站点</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
